services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: gear-stack-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-backend}
      - POSTGRES_USER=${POSTGRES_USER:-backend}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - gear_stack_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"  # Exposed for development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Application (Development Mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: backend:dev
    container_name: gear-stack-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - PROJECT_NAME=${PROJECT_NAME:-backend}
      - APP_PORT=${APP_PORT:-8000}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-backend}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-backend}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Mount source code for hot reload
      # Paths are relative to docker-compose.dev.yml location (backend/ directory)
      # Using :delegated for better performance on WSL2/macOS
      - ./app:/app/app:rw,delegated
      - ./scripts:/app/scripts:rw,delegated
      - ./tests:/app/tests:rw,delegated
      - ./migrations:/app/migrations:rw,delegated
      - ./main.py:/app/main.py:rw,delegated
      - ./cli:/app/cli:ro,delegated
      - ./cli.py:/app/cli.py:ro,delegated
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gear_stack_postgres_data:
    driver: local

