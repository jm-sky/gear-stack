services:
  # MinIO Object Storage (S3-compatible)
  # Check https://quay.io/repository/minio/minio?tab=tags for latest version
  minio:
    image: quay.io/minio/minio:latest
    container_name: gear-stack-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"  # API port (only localhost, accessed via Caddy)
      - "127.0.0.1:9001:9001"  # Console port (only localhost, accessed via Caddy)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO Client - Initialize buckets and policies
  # Check https://quay.io/repository/minio/mc?tab=tags for latest version
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: gear-stack-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb localminio/uploads --ignore-existing;
      /usr/bin/mc anonymous set download localminio/uploads;
      exit 0;
      "
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

volumes:
  minio_data:
    driver: local

